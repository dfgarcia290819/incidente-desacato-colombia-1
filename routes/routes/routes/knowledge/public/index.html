<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ Asistente Jurídico - Tutelas y Desacato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
        }

        .results {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .results h3 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .validation-status {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .validation-status.valid {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .validation-status.invalid {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .document-preview {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ Asistente Jurídico Colombiano</h1>
            <p>Genera, valida y estructura documentos de tutela y desacato</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>📋 Generar Tutela</h2>
                <form id="tutelaForm">
                    <div class="form-group">
                        <label>Nombre del Accionante</label>
                        <input type="text" name="accionante_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Cédula</label>
                        <input type="text" name="accionante_cedula" required>
                    </div>
                    <div class="form-group">
                        <label>Entidad Accionada</label>
                        <input type="text" name="accionado_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Derechos Vulnerados</label>
                        <select name="derechos" required>
                            <option value="">Seleccione...</option>
                            <option value="Derecho a la vida">Derecho a la vida</option>
                            <option value="Derecho a la salud">Derecho a la salud</option>
                            <option value="Derecho a la educación">Derecho a la educación</option>
                            <option value="Derecho a la vivienda">Derecho a la vivienda</option>
                            <option value="Derecho al trabajo">Derecho al trabajo</option>
                            <option value="Derecho a la dignidad">Derecho a la dignidad</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hechos Relevantes</label>
                        <textarea name="hechos" required></textarea>
                    </div>
                    <button type="submit">Generar Documento</button>
                </form>
            </div>

            <div class="card">
                <h2>📑 Generar Desacato</h2>
                <form id="desacatoForm">
                    <div class="form-group">
                        <label>Nombre del Accionante</label>
                        <input type="text" name="accionante_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Número de Sentencia Incumplida</label>
                        <input type="text" name="sentencia_numero" placeholder="Ej: T-406-92" required>
                    </div>
                    <div class="form-group">
                        <label>Conducta Incumplida</label>
                        <textarea name="conducta" placeholder="Describa qué ordenó la sentencia y qué no se cumplió" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Perjuicio Causado</label>
                        <textarea name="perjuicio" placeholder="Describa el daño causado por el incumplimiento" required></textarea>
                    </div>
                    <button type="submit">Generar Incidente</button>
                </form>
            </div>
        </div>

        <div class="results">
            <h3>📊 Resultado</h3>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Procesando...</p>
            </div>
            <div id="resultsContent" style="display: none;">
                <div id="error" class="error" style="display: none;"></div>
                <div id="validationStatus"></div>
                <div class="score" id="score"></div>
                <h4>Vista Previa del Documento:</h4>
                <div class="document-preview" id="preview"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tutelaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const datos = {
                accionante: {
                    nombre: formData.get('accionante_nombre'),
                    cedula: formData.get('accionante_cedula')
                },
                accionado: {
                    entidad: formData.get('accionado_nombre')
                },
                derechos: [formData.get('derechos')],
                hechos: formData.get('hechos')
            };
            await generarDocumento('/api/generar/tutela', datos);
        });

        document.getElementById('desacatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const datos = {
                accionante: {
                    nombre: formData.get('accionante_nombre')
                },
                sentencia_incumplida: {
                    numero: formData.get('sentencia_numero')
                },
                conducta: {
                    descripcion: formData.get('conducta')
                },
                perjuicio: {
                    daño_causado: formData.get('perjuicio')
                }
            };
            await generarDocumento('/api/generar/desacato', datos);
        });

        async function generarDocumento(url, datos) {
            const loading = document.getElementById('loading');
            const resultsContent = document.getElementById('resultsContent');
            const errorDiv = document.getElementById('error');
            const validationStatus = document.getElementById('validationStatus');
            const preview = document.getElementById('preview');
            const score = document.getElementById('score');

            loading.style.display = 'block';
            resultsContent.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Error desconocido');
                }

                const valClass = result.validacion.valido ? 'valid' : 'invalid';
                validationStatus.innerHTML = `
                    <div class="validation-status ${valClass}">
                        <strong>${result.validacion.valido ? '✅ VÁLIDO' : '⚠️ REQUIERE CORRECCIONES'}</strong>
                        <p>${result.mensaje}</p>
                    </div>
                `;

                score.textContent = `Puntuación: ${result.validacion.puntuacion}%`;

                const docJson = JSON.stringify(result.documento, null, 2);
                preview.textContent = docJson.substring(0, 1000) + '\n... [Documento completo disponible]';

                resultsContent.style.display = 'block';
            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
                resultsContent.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
